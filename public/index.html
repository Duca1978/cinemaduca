<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Duca • GTA7 Lab</title>
<style>body{margin:0;background:#11131c;color:#f5f5fa;font:17px system-ui}main{max-width:960px;margin:auto;padding:40px 24px}h1{font-size:48px;margin-bottom:8px}small{color:#bac0d3}input,button{padding:12px;border-radius:8px;border:1px solid #777;font:inherit}button{background:#ffd369;color:#141414;cursor:pointer}form{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}article{background:#202432;padding:24px;border-radius:12px;margin:18px 0}h2{margin-top:0}figure{margin:18px 0}figure img{display:block;width:min(100%,280px);height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:10px}figcaption{font-size:14px;color:#bac0d3;margin-top:8px}.session{border-top:1px solid #50576d;margin-top:16px;padding-top:16px}details{margin-top:12px}p{line-height:1.6}</style></head>
<body><main><small>GTA7 LAB / ENTRETENIMENTO</small><h1>Cinema Duca</h1><p>Histórias para descobrir. Consulte filmes, sessões e assentos.</p><small>Demonstração com dados fictícios e datas fixas. Reservas simuladas via MCP apenas no servidor local. Na Vercel, somente consultas. Sem pagamentos.</small>
<form id="search"><input id="query" aria-label="Título do filme" placeholder="Buscar filme"><input id="genre" aria-label="Gênero" placeholder="Gênero"><input id="actor" aria-label="Ator ou atriz" placeholder="Ator ou atriz"><input id="year" type="number" min="1000" max="9999" step="1" aria-label="Ano de lançamento" placeholder="Ano de lançamento"><button type="submit">Buscar</button><button type="button" id="show-all">Todos os filmes</button></form><h2 id="catalog-title">Todos os filmes</h2><div id="results" aria-live="polite"></div></main>
<script type="module">
const results=document.querySelector('#results');
const el=(tag,text)=>{const node=document.createElement(tag);node.textContent=text;return node};
async function load(applyFilters=false){results.textContent='Carregando…';try{const params=new URLSearchParams({query:applyFilters?document.querySelector('#query').value:'',genre:applyFilters?document.querySelector('#genre').value:'',actor:applyFilters?document.querySelector('#actor').value:'',year:applyFilters?document.querySelector('#year').value:''});const [mr,sr]=await Promise.all([fetch('/api/movies?'+params),fetch('/api/sessions')]);if(!mr.ok||!sr.ok)throw Error();const {movies}=await mr.json();const {sessions}=await sr.json();document.querySelector('#catalog-title').textContent=applyFilters&&(params.get('query')||params.get('genre')||params.get('actor')||params.get('year'))?'Resultados da busca':'Todos os filmes';results.replaceChildren();if(!movies.length)results.textContent='Nenhum filme encontrado.';for(const movie of movies){const card=el('article','');card.append(el('h2',movie.title),el('small',`${movie.year} · ${movie.genre} · ${movie.durationMinutes} min · Classificação: ${movie.ageRating===0?'Livre':movie.ageRating+' anos'}`),el('p',movie.synopsis),el('p',`Direção: ${movie.director} · Elenco: ${movie.cast.join(', ')}`));if(movie.protagonist){const figure=el('figure','');const image=document.createElement('img');image.src=movie.protagonist.imageUrl;image.alt=movie.protagonist.imageAlt;image.width=1086;image.height=1448;image.loading='lazy';image.decoding='async';figure.append(image,el('figcaption',`${movie.protagonist.name} · Protagonista fictícia · Imagem criada com IA`));card.append(figure)}for(const s of sessions.filter(s=>s.movieId===movie.id)){const block=el('div',`${s.date.split('-').reverse().join('/')} às ${s.time} · ${s.roomName} · ${new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(s.priceBRL)}`);block.className='session';const details=el('details','');details.append(el('summary',`${s.availableSeats.length} assentos disponíveis`),el('p',s.availableSeats.join(' · ')));block.append(details);card.append(block)}results.append(card)}}catch{results.textContent='Não foi possível carregar os dados. Tente novamente.'}}
document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();void load(true)});document.querySelector('#show-all').addEventListener('click',()=>{document.querySelector('#search').reset();void load()});void load();
</script></body></html>
