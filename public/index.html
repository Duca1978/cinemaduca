<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Duca • GTA7 Lab</title>
<style>body{margin:0;background:#11131c;color:#f5f5fa;font:17px system-ui}main{max-width:960px;margin:auto;padding:40px 24px}h1{font-size:48px;margin-bottom:8px}small{color:#bac0d3}input,button{padding:12px;border-radius:8px;border:1px solid #777;font:inherit}button{background:#ffd369;color:#141414;cursor:pointer}form{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}article{background:#202432;padding:24px;border-radius:12px;margin:18px 0}h2{margin-top:0}figure{margin:18px 0}figure img{display:block;width:min(100%,280px);height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:10px}figcaption{font-size:14px;color:#bac0d3;margin-top:8px}.session{border-top:1px solid #50576d;margin-top:16px;padding-top:16px}details{margin-top:12px}p{line-height:1.6}button:disabled{opacity:.5;cursor:not-allowed}fieldset{border:1px solid #50576d;border-radius:8px;padding:14px}.seats{display:flex;gap:10px;flex-wrap:wrap}.seats label{display:flex;align-items:center;gap:4px;padding:8px;background:#30364a;border-radius:6px}.reservation-form{display:block}.reservation-form button{margin-top:12px}.receipt{padding:16px;background:#30364a;border-radius:8px;margin-top:12px}.receipt code{display:block;overflow-wrap:anywhere}.receipt button{margin-top:10px}.status{min-height:1.5em}.cancel-form input{max-width:100%;box-sizing:border-box}.cancel-form label{display:block;margin-top:12px}.cancel-form button{margin-top:12px}</style></head>
<body><main><small>GTA7 LAB / ENTRETENIMENTO</small><h1>Cinema Duca</h1><p>Histórias para descobrir. Consulte filmes, sessões e assentos.</p><small>Demonstração com dados fictícios e datas fixas. Reservas simuladas apenas no servidor local. Na Vercel, somente consultas. Sem pagamentos.</small>
<form id="search"><input id="query" aria-label="Título do filme" placeholder="Buscar filme"><input id="genre" aria-label="Gênero" placeholder="Gênero"><input id="actor" aria-label="Ator ou atriz" placeholder="Ator ou atriz"><input id="year" type="number" min="1000" max="9999" step="1" aria-label="Ano de lançamento" placeholder="Ano de lançamento"><button type="submit">Buscar</button><button type="button" id="show-all">Todos os filmes</button></form><h2 id="catalog-title">Todos os filmes</h2><div id="results" aria-live="polite"></div></main>
<script type="module" src="/app.js"></script></body></html>
